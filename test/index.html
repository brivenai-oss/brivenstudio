<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botez</title>
<style>
:root{--ivory:#FBF8F1;--blue:#9DB4C8;--soft:#DCE6EE;--night:#2B3A4F;--gold:#B8975A}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--night);font:400 1.05rem/1.7 system-ui,sans-serif;text-align:center}
body.locked{overflow:hidden}
section,header,footer,#intro{font-family:var(--fb)}
h1,h2,h3,.ff{font-family:var(--fh);font-weight:400;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
section{padding:3.5rem 1.25rem}
.wrap{max-width:980px;margin:0 auto}
.ic{width:1em;height:1em;display:inline-block}
h2{font-size:clamp(2rem,6vw,2.6rem);line-height:1.2;margin-bottom:.6rem}
.div{display:flex;align-items:center;gap:.8rem;justify-content:center;color:var(--gold);margin:1.6rem auto;max-width:260px}
.div:before,.div:after{content:"";flex:1;height:1px;background:currentColor;opacity:.7}
.div .ic{width:16px}
.btn{display:inline-block;font:700 1rem var(--fb);color:var(--night);background:transparent;border:1.5px solid var(--gold);border-radius:999px;padding:.8rem 1.7rem;text-decoration:none;cursor:pointer;transition:background .2s}
.btn:hover{background:rgba(184,151,90,.18)}
.btn.solid{background:var(--night);color:var(--ivory);border-color:var(--night)}
.btn.solid:hover{background:#3b4d66}
.btn[disabled]{opacity:.6;cursor:wait}
.skip{background:none;border:0;font:inherit;font-size:.9rem;text-decoration:underline;color:var(--night);cursor:pointer;padding:.5rem}

/* Plic */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;background:radial-gradient(ellipse at 50% 30%,#C9D8E5,var(--blue) 70%);transition:opacity .9s;padding:1rem;animation:rise .9s backwards}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#intro.unroll{pointer-events:none;animation:uncover 2.4s cubic-bezier(.55,0,.25,1) forwards}
@keyframes uncover{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(100% 0 0 0)}}
#roll{display:none;position:fixed;left:0;right:0;top:0;height:30px;z-index:51;border-radius:15px;pointer-events:none;background:linear-gradient(#cfc2a3,#f6efdc 30%,#fffaf0 50%,#e4d8bc 75%,#b9aa86);box-shadow:0 -8px 16px rgba(43,58,79,.25),0 6px 10px rgba(43,58,79,.2)}
#roll.go{display:block;animation:rollmove 2.4s cubic-bezier(.55,0,.25,1) forwards}
@keyframes rollmove{from{transform:translateY(-15px)}to{transform:translateY(100vh)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.it{font-size:1.7rem;font-style:italic;margin:0}
.in{font-size:clamp(3rem,12vw,4.8rem);line-height:1.1;margin:0}
.env{position:relative;width:min(86vw,420px);aspect-ratio:3/2;margin:1.6rem 0 .6rem;perspective:1100px;filter:drop-shadow(0 22px 22px rgba(43,58,79,.28))}
.env>*{position:absolute}
.eb{inset:0;border-radius:8px;z-index:0;background:radial-gradient(circle,rgba(184,151,90,.55) 1px,transparent 1.6px) 0 0/26px 26px,linear-gradient(#E9F0F6,#D2DEE9)}
.letter{left:7%;right:7%;top:9%;bottom:9%;z-index:1;border-radius:4px;background:var(--ivory);box-shadow:inset 0 0 0 1px var(--gold),inset 0 0 0 6px var(--ivory),inset 0 0 0 7px rgba(184,151,90,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;font:italic 1.35rem var(--fh);color:var(--night);transition:transform 1.5s 1s cubic-bezier(.22,.7,.2,1)}
.letter .ic{color:var(--gold);width:22px;height:22px}
.pocket{inset:0;z-index:2;border-radius:0 0 8px 8px;background:linear-gradient(160deg,#EEF3F8,#C9D8E5);clip-path:polygon(0 100%,0 28%,50% 62%,100% 28%,100% 100%)}
.flap{left:0;right:0;top:0;height:62%;z-index:3;transform-origin:top;background:linear-gradient(#DCE7F0,#BDCEDD);clip-path:polygon(0 0,100% 0,50% 100%)}
.seal{left:50%;top:62%;width:58px;height:58px;margin:-29px 0 0 -29px;z-index:4;border-radius:50%;display:grid;place-items:center;color:var(--ivory);background:radial-gradient(circle at 35% 30%,#DEC58F,var(--gold) 55%,#8E7040);box-shadow:0 3px 7px rgba(0,0,0,.3),inset 0 0 0 4px rgba(255,255,255,.16)}
.seal .ic{width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.sp{left:50%;top:60%;width:var(--s,5px);height:var(--s,5px);border-radius:50%;background:var(--gold);box-shadow:0 0 9px var(--gold);opacity:0;z-index:5}
.seal{animation:glow 2.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 7px rgba(0,0,0,.3),0 0 0 9px rgba(184,151,90,.2),inset 0 0 0 4px rgba(255,255,255,.16)}}
.env.open .seal{animation:seal .8s forwards}
@keyframes seal{35%{transform:scale(1.15)}100%{transform:scale(.5);opacity:0}}
.env.open .flap{animation:flap 1.2s .5s cubic-bezier(.45,0,.2,1) forwards}
@keyframes flap{0%{transform:rotateX(0);z-index:3}49%{transform:rotateX(90deg);z-index:3}50%{z-index:0}100%{transform:rotateX(180deg);z-index:0}}
.env.open .sp{animation:spark 2.2s calc(1.2s + var(--d,0s)) ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
.env.open .letter{transform:translateY(-64%)}
.env.out .letter{transition:transform 1.2s cubic-bezier(.65,0,.35,1);transform:translateY(-44%) scale(1.5)}
.eb,.pocket,.flap{transition:opacity .9s ease}
.env.out .eb,.env.out .pocket,.env.out .flap{opacity:0}

/* Hero */
.hero{position:relative;padding:5rem 1.25rem 4.5rem;background:linear-gradient(#8FA9C0,#B9CBDB 55%,var(--ivory));overflow:hidden}
.hero .moon{width:96px;height:96px;color:var(--gold);filter:drop-shadow(0 0 26px rgba(184,151,90,.6))}
.hero .st{position:absolute;width:15px;height:15px;color:var(--gold);opacity:.85}
.hero .sub{font-size:1.7rem;font-style:italic;margin:.6rem 0 0}
.hero h1{font-size:clamp(3.6rem,15vw,7.5rem);line-height:1.15;padding:0 .2em;clip-path:inset(-10% 100% -10% 0)}
.shown .hero h1{animation:wr 2.4s .9s cubic-bezier(.5,0,.2,1) forwards}
@keyframes wr{to{clip-path:inset(-10% 0 -10% 0)}}
.hero .date{font:700 1.2rem var(--fb);margin:1rem 0 0}

/* Countdown */
.count{display:flex;justify-content:center;gap:clamp(.5rem,2.5vw,1.2rem)}
.count div{min-width:70px;padding:.9rem .4rem;border:1px solid var(--gold);border-radius:16px;background:rgba(255,255,255,.5)}
.count b{display:block;font:400 clamp(2rem,8vw,3rem)/1 var(--fh);font-variant-numeric:tabular-nums}
.count span{font-size:.85rem}
#cd-done{font:italic 1.8rem var(--fh)}

/* Familie, descriere, poze */
.family{display:grid;gap:2rem;max-width:780px;margin:0 auto}
.family h3{font-size:1.5rem;font-style:italic}
.family p{font:400 clamp(2rem,7vw,2.8rem)/1.25 var(--fh);margin:.2rem 0 0;text-wrap:balance}
.msg{max-width:36rem;margin:0 auto}
.msg p{margin:0 0 1rem}
.gal{display:grid;gap:1rem;max-width:900px;margin:0 auto;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.gal.g1{grid-template-columns:min(100%,320px);justify-content:center}
.gal figure{margin:0}
.gal img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--gold);padding:5px;background:var(--ivory)}
.p-arch img{border-radius:999px 999px 14px 14px}
.p-rounded img{border-radius:22px}
.p-circle img{aspect-ratio:1;border-radius:50%}
.p-oval img{border-radius:50%}
.p-frame img{border-radius:3px;padding:10px;box-shadow:0 0 0 1px var(--gold)}
.p-polaroid{background:#fff;padding:10px 10px 38px;box-shadow:0 6px 18px rgba(43,58,79,.18)}
.p-polaroid:nth-child(odd){transform:rotate(-2deg)}
.p-polaroid:nth-child(even){transform:rotate(2deg)}
.p-polaroid img{aspect-ratio:1;border:0;padding:0;border-radius:2px}
.p-hex img{aspect-ratio:1/1.1;border:0;padding:0;background:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.msg div{margin:0 0 .6rem}

/* Locații */
.locs{display:grid;gap:2.5rem;margin-top:2rem}
.loc{border:1px solid var(--gold);border-radius:18px;padding:2.2rem 1.4rem 2rem;background:rgba(255,255,255,.45)}
.s-softarch{border-radius:110px 110px 18px 18px;padding-top:2.8rem}
.s-arch{border-radius:220px 220px 18px 18px;padding-top:2.8rem}
.s-oval{border-radius:50%/38%;padding:3.4rem 2.4rem}
.s-frame{border-radius:3px;box-shadow:inset 0 0 0 7px var(--ivory),inset 0 0 0 8px var(--gold)}
.s-stitched{border:2px dashed var(--gold);border-radius:26px}
.s-open{border:0;border-top:1px solid var(--gold);border-radius:0;background:none}
.loc .ic{width:28px;height:28px;color:var(--gold)}
.loc h3{font-size:2rem;font-style:italic}
.loc .time{font:400 3rem/1.1 var(--fh);margin:.2rem 0}
.loc .place{font-weight:700;margin:.4rem 0 0}
.loc address{font-style:normal;margin-bottom:1.2rem}
.btns{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
@media(min-width:780px){.locs{grid-template-columns:1fr 1fr;gap:3rem}.family{grid-template-columns:1fr 1fr}}

/* RSVP, subsol, muzică */
.rsvp{background:linear-gradient(var(--ivory),var(--soft) 30%)}
form{max-width:420px;margin:1.5rem auto 0;text-align:left}
label{display:block;font-weight:700;margin:1rem 0 .3rem}
input{width:100%;font:inherit;padding:.85rem 1rem;border:1.5px solid #8fa5b9;border-radius:12px;background:#fff;color:var(--night)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#status{min-height:1.6rem;margin:1rem 0 .5rem;font-weight:700}
#status.err{color:#9b2c2c}
form .btn{width:100%;margin-top:.5rem}
.ans{border:0;padding:0;margin:1.1rem 0 0}
.ans legend{font-weight:700;padding:0;margin-bottom:.3rem}
.rad{display:flex;align-items:center;gap:.7rem;font-weight:400;margin:.4rem 0;padding:.75rem 1rem;border:1.5px solid #8fa5b9;border-radius:12px;background:#fff;cursor:pointer}
.rad input{width:auto;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.rad:has(input:checked){border-color:var(--gold);background:#fffaf0}
.ok{font:italic 1.7rem/1.4 var(--fh);max-width:30rem;margin:1.5rem auto 0}
.rsvp>.ic{width:64px;height:64px;color:var(--gold);margin-top:1.8rem}
footer{padding:3rem 1.25rem 4.5rem}
footer p{font:400 clamp(2.2rem,8vw,3rem)/1.3 var(--fh);margin:0}
footer small{display:block;margin-top:.8rem}
#music{position:fixed;right:14px;bottom:14px;z-index:20;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--gold);background:var(--ivory);color:var(--night);font-size:1.3rem;cursor:pointer;display:none}
#music[aria-pressed="true"]{background:var(--night);color:var(--ivory)}
#music.line::after{content:"";position:absolute;left:10px;right:10px;top:23px;border-top:2px solid currentColor;transform:rotate(-40deg)}

/* Fundal header/footer */
#page{position:relative;isolation:isolate}
.hero,.ftr{position:relative;isolation:isolate;color:var(--ht,var(--night))}
.hin{position:relative}
.fx{position:absolute;inset:0;z-index:-1;overflow:hidden}
.fx .bgimg,.fx .ov{position:absolute;inset:0}
.fx .bgimg{background-repeat:no-repeat}
.fx.h{-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.fx.f{-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.hero[data-f]{background:none}
.m-single #mid{background:linear-gradient(transparent,var(--ivory) 170px,var(--ivory) calc(100% - 170px),transparent)}
[data-f=glass] .hin{background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.55);border-radius:28px;padding:1.6rem 1.2rem;max-width:660px;margin:0 auto}

@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
html:not(.full) main *,html:not(.full) footer *,html:not(.full) #music,html:not(.full) #intro{transition:none!important;animation:none!important}
html:not(.full) .hero h1{clip-path:none}
html:not(.full) .sp{display:none}
html:not(.full) .seal,html:not(.full) .env.open .seal{animation:none}
html:not(.full) .pocket,html:not(.full) .flap,html:not(.full) .eb,html:not(.full) .seal{transition:opacity .8s!important}
html:not(.full) .env.open .pocket,html:not(.full) .env.open .flap,html:not(.full) .env.open .eb,html:not(.full) .env.open .seal{opacity:0}
html:not(.full) .env.open .letter,html:not(.full) .env.out .letter{transform:none}
html:not(.full) #intro.gone{transition:opacity 2.2s ease!important}
}
</style>
</head>

const SEC={
count:()=>`<section ${fv("count")} aria-label="Timp rămas"><div class="count" id="count" role="timer"><div><b id="cd-d">0</b><span>zile</span></div><div><b id="cd-h">0</b><span>ore</span></div><div><b id="cd-m">0</b><span>minute</span></div><div><b id="cd-s">0</b><span>secunde</span></div></div><p id="cd-done" hidden></p></section>`,
family:()=>`<section ${fv("family")}><div class="family"><div><h3>${esc(C.family.parentsLabel)}</h3><p>${nl(C.family.parents)}</p></div><div><h3>${esc(C.family.godLabel)}</h3><p>${nl(C.family.gods)}</p></div></div></section>`,
desc:()=>`<section ${fv("desc")}>${divider}<div class="msg">${D.html}</div></section>`,
photos:()=>C.photos.length?`<section>${gal}</section>`:"",
locs:()=>`<section ${fv("locs")}><div class="wrap"><h2>${esc(C.locs.title)}</h2>${divider}<div class="locs">${C.locs.items.map(l=>`<article class="loc s-${esc(l.shape||"rounded")}" data-q="${esc(l.q)}">${ic(l.icon)}<h3>${esc(l.label)}</h3><p class="time ff">${esc(l.time)}</p><p>${esc(l.date)}</p><p class="place">${esc(l.place)}</p><address>${esc(l.address)}</address><div class="btns"><a class="btn" data-nav="g" target="_blank" rel="noopener">${esc(C.locs.gmaps)}</a><a class="btn" data-nav="w" target="_blank" rel="noopener">${esc(C.locs.waze)}</a></div></article>`).join("")}</div></div></section>`,
rsvp:()=>`<section class="rsvp" ${fv("rsvp")}><h2>${esc(C.rsvp.title)}</h2><p>${esc(C.rsvp.intro)}</p>
<form id="form" method="post" target="rsvpFrame" novalidate><label for="name">${esc(C.rsvp.name)}</label><input id="name" name="name" autocomplete="name" maxlength="80" required>
<label for="phone">${esc(C.rsvp.phone)}</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required>
<fieldset class="ans"><legend>${esc(C.rsvp.answer||"Răspunsul tău")}</legend><label class="rad"><input type="radio" name="answer" value="da"> ${esc(C.rsvp.yes||"Voi participa")}</label><label class="rad"><input type="radio" name="answer" value="nu"> ${esc(C.rsvp.no||"Nu pot participa")}</label></fieldset>
<div id="gwrap" hidden><div class="two"><div><label for="adults">${esc(C.rsvp.adults||"Număr de adulți")}</label><input id="adults" name="adults" type="number" inputmode="numeric" min="1" max="${C.rsvp.maxGuests}" value="1"></div><div><label for="kids">${esc(C.rsvp.kids||"Număr de copii")}</label><input id="kids" name="kids" type="number" inputmode="numeric" min="0" max="${Math.max(0,C.rsvp.maxGuests-1)}" value="0"></div></div></div>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><input type="hidden" name="_t" id="_t">
<p id="status" role="status" aria-live="polite"></p><button class="btn solid" id="send" type="submit">${esc(C.rsvp.button)}</button></form>
<iframe name="rsvpFrame" title="" hidden></iframe><p class="ok" id="ok" hidden></p>${ic(I.rsvp)}</section>`};
const secs=(C.sections||["count","family","desc","photos","locs","rsvp"].map(id=>({id}))).slice();
if(!secs.some(x=>x.id==="photos")){const i=secs.findIndex(x=>x.id==="desc");secs.splice(i<0?secs.length:i+1,0,{id:"photos",on:true})}
const mid=secs.filter(x=>x.on!==false&&SEC[x.id]).map(x=>SEC[x.id]()).join("");
$("app").innerHTML=`
<div id="intro" ${fv("intro")} role="dialog" aria-label="Invitație">
<p class="it ff">${esc(C.intro.title)}</p><p class="in ff">${esc(C.hero.name)}</p>
<div class="env" id="env" aria-hidden="true"><div class="eb"></div><div class="letter">${ic(I.seal)}<span>${esc(C.intro.letter)}</span></div><div class="pocket"></div><div class="flap"></div><div class="seal">${ic(I.seal)}</div>${sparks}</div>
<button class="btn solid" id="openBtn" type="button">${esc(C.intro.button)}</button>
<button class="skip" id="skipBtn" type="button">${esc(C.intro.skip)}</button></div>
<div id="roll" aria-hidden="true"></div>
<div id="page" class="m-${mode}">${mode==="single"?fx(pg,"p"):""}
<main>
<header class="hero" ${hd("header")} ${fv("hero",hs("header"))}>${mode==="separate"?fx(bg.header,"h"):""}${stars}<div class="hin"><span class="moon" style="display:inline-block">${ic(I.hero).replace('class="ic"','class="ic" style="width:100%;height:100%"')}</span>
<p class="sub ff">${esc(C.hero.sub)}</p><h1>${esc(C.hero.name)}</h1><p class="date">${esc(C.hero.date)}</p></div></header>
<div id="mid">${mid}</div>
</main>
<footer class="ftr" ${hd("footer")} ${fv("footer",hs("footer"))}>${mode==="separate"?fx(bg.footer,"f"):""}<div class="hin"><p>${esc(C.footer.line)}</p><small>${esc(C.footer.sign)}</small></div></footer>
</div>
<button id="music" type="button" aria-pressed="false" aria-label="Pornește muzica" title="Muzică">♪</button>`;

/* Plic */
const env=$("env"),intro=$("intro");
const FULL=location.search.includes("anim")||window.FULLANIM;
if(FULL)document.documentElement.classList.add("full");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches&&!FULL;
function closeIntro(){intro.classList.add("gone");document.body.classList.remove("locked");document.body.classList.add("shown");window.scrollTo(0,0)}
$("openBtn").addEventListener("click",()=>{env.classList.add("open");$("openBtn").disabled=true;
 if(reduce)return setTimeout(closeIntro,2200);
 setTimeout(rollIntro,3100)});
function rollIntro(){document.body.classList.remove("locked");document.body.classList.add("shown");window.scrollTo(0,0);$("roll").classList.add("go");intro.classList.add("unroll");setTimeout(()=>{intro.classList.add("gone");$("roll").classList.remove("go")},2600)}
$("skipBtn").addEventListener("click",closeIntro);
if(window.PREVIEW)closeIntro();

/* Navigare */
document.querySelectorAll(".loc").forEach(l=>{const q=encodeURIComponent(l.dataset.q);
 l.querySelector('[data-nav="g"]').href="https://www.google.com/maps/search/?api=1&query="+q;
 l.querySelector('[data-nav="w"]').href="https://waze.com/ul?q="+q+"&navigate=yes"});

/* Countdown */
const T=new Date(C.count.start).getTime(),E=new Date(C.count.end).getTime();
function tick(){const left=T-Date.now();
 if(left<=0){$("count").hidden=true;const d=$("cd-done");d.hidden=false;d.textContent=Date.now()<E?C.count.live:C.count.done;clearInterval(timer);return}
 const s=Math.floor(left/1000);$("cd-d").textContent=Math.floor(s/86400);$("cd-h").textContent=Math.floor(s%86400/3600);$("cd-m").textContent=Math.floor(s%3600/60);$("cd-s").textContent=s%60}
const timer=$("count")?setInterval(tick,1000):0;if($("count"))tick();

/* RSVP */
const ansVal=()=>{const c=document.querySelector("[name=answer]:checked");return c?c.value:""};
const form=$("form")||document.createElement("form"),st=$("status"),send=$("send"),t0=Date.now();let waiting=null;
const say=(m,e)=>{st.textContent=m;st.className=e?"err":""};
function fin(){clearTimeout(waiting);waiting=null;send.disabled=false;send.textContent=C.rsvp.button}
form.addEventListener("submit",ev=>{ev.preventDefault();if(waiting)return;
 const n=$("name").value.trim(),p=$("phone").value.trim(),a=Number($("adults").value),k=Number($("kids").value||0),M=C.rsvp.maxGuests,ans=ansVal();
 if(n.length<3)return say("Te rugăm să scrii numele și prenumele.",1);
 if(!/^\+?[\d\s().-]{7,20}$/.test(p))return say("Te rugăm să scrii un număr de telefon valid.",1);
 if(!ans)return say("Te rugăm să alegi dacă vei participa.",1);
 if(ans==="da"&&(!Number.isInteger(a)||a<1||!Number.isInteger(k)||k<0||a+k>M))return say("Alege cel puțin un adult; în total pot veni maximum "+M+" persoane (adulți + copii).",1);
 if(!/^https:\/\/script\.google\.com\//.test(C.rsvp.scriptUrl))return say("Formularul nu este configurat încă (lipsește URL-ul scriptului).",1);
 form.action=C.rsvp.scriptUrl;$("_t").value=Date.now()-t0;send.disabled=true;send.textContent="Se trimite…";say("");
 waiting=setTimeout(()=>{fin();say("Nu am primit răspuns. Verifică conexiunea și încearcă din nou, sau sună-ne.",1)},15000);form.submit()});
addEventListener("message",ev=>{const d=ev.data;if(!d||d.source!=="sebastian-rsvp"||!waiting)return;const n=$("name").value.trim();fin();
 if(d.ok){form.hidden=true;const o=$("ok");o.hidden=false;o.textContent=(ansVal()==="nu"?(C.rsvp.okNo||"Ne pare rău că nu poți fi alături de noi, {name}. Mulțumim că ne-ai anunțat!"):C.rsvp.ok).replace("{name}",n)}else say(d.error||"Confirmarea nu a putut fi salvată. Încearcă din nou.",1)});

form.querySelectorAll('[name=answer]').forEach(r=>r.addEventListener("change",()=>{$("gwrap").hidden=ansVal()!=="da"}));

/* Muzică */
const mb=$("music"),au=$("audio"),ms=on=>{mb.setAttribute("aria-pressed",on);mb.classList.toggle("line",!on);mb.setAttribute("aria-label",on?"Oprește muzica":"Pornește muzica")};
if(C.music.src){au.src=C.music.src;mb.style.display="block";ms(false);au.addEventListener("error",()=>mb.style.display="none");
 mb.addEventListener("click",()=>{if(au.paused)au.play().then(()=>ms(true)).catch(()=>ms(false));else{au.pause();ms(false)}})}
</script>
</body>
</html>
