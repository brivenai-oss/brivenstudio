<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chatbot activity</title>
<style>
  :root{
    --bg:#F1F4F7; --sheet:#FFFFFF; --ink:#17212B; --muted:#566371; --rule:#DCE2E8;
    --grey:#8A96A3; --brand:#2F6F4E; --amber:#B45309; --red:#B42318;
  }
  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:32px 16px 56px;}
  .sheet{max-width:760px;margin:0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:0 36px;}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:22px 0 18px;border-bottom:1px solid var(--rule);}
  .top h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.005em;}
  .top .month{color:var(--muted);font-size:14px;white-space:nowrap;}
  section{padding:26px 0;border-bottom:1px solid var(--rule);}
  section:last-of-type{border-bottom:none;}
  h2{margin:0 0 4px;font-size:16px;font-weight:650;}
  .sub{margin:0 0 18px;color:var(--muted);font-size:14px;max-width:62ch;}
  .headline{margin:0;font-size:clamp(26px,5.4vw,36px);line-height:1.18;font-weight:650;letter-spacing:-.015em;font-variant-numeric:tabular-nums;max-width:22ch;}
  .headline-sub{margin:10px 0 0;color:var(--muted);font-size:15px;max-width:56ch;}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;}
  .fact{padding:0 20px;border-left:1px solid var(--rule);}
  .fact:first-child{padding-left:0;border-left:none;}
  .fact .fig{font-size:30px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1;}
  .fact .lbl{margin-top:6px;font-size:14px;line-height:1.35;}
  .fact .det{margin-top:2px;font-size:13px;color:var(--muted);line-height:1.35;}
  .facts.two{grid-template-columns:repeat(2,1fr);}

  /* charts: plain HTML/CSS bars, so labels stay readable at any width */
  .chart{--h:150px;}
  .bars{display:grid;align-items:end;height:var(--h);column-gap:var(--gap,3px);border-bottom:1px solid var(--grey);}
  .col{height:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;min-width:0;}
  .seg{width:100%;transform-origin:bottom;animation:rise .55s cubic-bezier(.2,.7,.2,1) both;}
  .seg.brand{background:var(--brand);}
  .seg.grey{background:var(--grey);}
  .seg.faint{opacity:.55;}
  .stub{height:2px;background:var(--grey);opacity:.55;width:100%;}
  .future{height:2px;background:var(--rule);width:100%;}
  .axis{display:grid;column-gap:var(--gap,3px);margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .axis span{white-space:nowrap;overflow:visible;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 14px;font-size:13.5px;color:var(--muted);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px;}
  .note{margin:12px 0 0;font-size:13px;color:var(--muted);max-width:68ch;}
  .empty{padding:34px 0;color:var(--muted);font-size:14.5px;border-bottom:1px solid var(--grey);}

  .hist{display:grid;grid-template-columns:repeat(6,1fr);column-gap:10px;align-items:end;}
  .hist .cell{display:flex;flex-direction:column;align-items:stretch;min-width:0;}
  .hist .barwrap{height:134px;padding-top:24px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--grey);}
  .hist .item{position:relative;width:100%;}
  .hist .item .val{position:absolute;left:0;right:0;bottom:100%;padding-bottom:4px;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .hist .item .seg{height:100%;}
  .hist .item .stub{height:100%;}
  .hist .mon{text-align:center;font-size:13px;margin-top:7px;}
  .hist .qs{text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}

  .plan{margin:0 0 14px;}
  .plan p{margin:0;font-size:14.5px;}
  .plan .meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:12px 0 8px;max-width:420px;}
  .plan .meter b{display:block;height:100%;}
  .plan .warn{color:var(--muted);font-size:13.5px;max-width:62ch;}
  .defs{margin:0;font-size:13px;color:var(--muted);max-width:68ch;}
  .defs + .defs{margin-top:6px;}
  .state{padding:48px 0;color:var(--muted);}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  @keyframes rise{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @media (prefers-reduced-motion:reduce){.seg{animation:none;}}
  @media (max-width:560px){
    body{padding:16px 10px 40px;}
    .sheet{padding:0 18px;}
    .top{flex-direction:column;gap:2px;}
    .facts,.facts.two{grid-template-columns:1fr;margin-top:22px;}
    .fact,.fact:first-child{padding:14px 0;border-left:none;border-top:1px solid var(--rule);}
    .fact:first-child{border-top:none;padding-top:0;}
    .hist{column-gap:6px;}
  }
</style>
</head>
<body>
  <main class="sheet" id="app" aria-live="polite">
    <div class="state">Loading activity&hellip;</div>
  </main>
  <noscript><p style="text-align:center;color:#566371;">This page needs JavaScript to show your chatbot's activity.</p></noscript>
  <script>
    (function(){
      var DATA_URL = "https://widget-relay.brivenstudio.com/client-usage?client=briven-studio&token=d2c99acab99aa922c0d09df115dac5de";
      var app = document.getElementById('app');

      function esc(s){
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      }
      function fmt(n){ return Number(n).toLocaleString('en-US'); }
      function plural(n, one, many){ return n === 1 ? one : many; }
      function pct(n, d){ return d > 0 ? Math.round((n / d) * 100) : 0; }
      function hr12(h){
        if (h === 0) return '12am';
        if (h < 12) return h + 'am';
        if (h === 12) return '12pm';
        return (h - 12) + 'pm';
      }
      function clock(hhmm){
        var p = String(hhmm).split(':');
        var h = parseInt(p[0], 10), m = parseInt(p[1], 10) || 0;
        var suffix = h >= 12 ? 'pm' : 'am';
        var h12 = h % 12; if (h12 === 0) h12 = 12;
        return h12 + (m ? ':' + (m < 10 ? '0' + m : m) : '') + suffix;
      }
      var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      function dayRange(days){
        var d = days.slice().sort(function(a, b){ return a - b; });
        var consecutive = d.every(function(v, i){ return i === 0 || v === d[i - 1] + 1; });
        if (d.length === 7) return 'every day';
        if (consecutive && d.length > 2) return DAY_NAMES[d[0]] + '–' + DAY_NAMES[d[d.length - 1]];
        return d.map(function(v){ return DAY_NAMES[v]; }).join(', ');
      }
      var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      function niceDate(iso){
        var p = String(iso).split('-');
        var m = parseInt(p[1], 10) - 1, day = parseInt(p[2], 10);
        return MONTHS[m] ? MONTHS[m] + ' ' + day : String(iso);
      }
      function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(String(c)) ? c : '#2F6F4E'; }

      // Bars scale to the largest value; any non-zero day keeps a visible sliver.
      function barPct(v, max){ return v <= 0 ? 0 : Math.max(3, (v / max) * 100); }

      function perDayChart(d){
        var n = d.daysInMonth, max = 1, total = 0, busiest = 0, busiestDay = 0, i;
        for (i = 0; i < n; i++){
          var c = d.days[i].c; total += c;
          if (c > max) max = c;
          if (c > busiest){ busiest = c; busiestDay = i + 1; }
        }
        var monthName = d.monthLabel.split(' ')[0];
        if (total === 0){
          return '<div class="empty">No conversations yet this month. They will show up here as visitors chat.</div>';
        }
        var bars = '', axis = '';
        for (i = 0; i < n; i++){
          var day = i + 1, v = d.days[i].c, q = d.days[i].q;
          var tip = esc(monthName + ' ' + day + ': ' + v + ' ' + plural(v, 'conversation', 'conversations') + (q ? ', ' + q + ' ' + plural(q, 'question', 'questions') : ''));
          if (day > d.today){
            bars += '<div class="col"><div class="future"></div></div>';
          } else if (v === 0){
            bars += '<div class="col" title="' + tip + '"><div class="stub"></div></div>';
          } else {
            bars += '<div class="col" title="' + tip + '"><div class="seg brand" style="height:' + barPct(v, max) + '%"></div></div>';
          }
          // Label day 1, every fifth day, and the last day when it is not crowding the previous label.
          var show = day === 1 || day % 5 === 0 || (day === n && n % 5 >= 3);
          axis += '<span>' + (show ? day : '') + '</span>';
        }
        var label = 'Conversations per day in ' + d.monthLabel + '. Busiest day: ' + monthName + ' ' + busiestDay + ' with ' + busiest + '.';
        return '<div class="chart" role="img" aria-label="' + esc(label) + '">' +
          '<div class="bars" style="grid-template-columns:repeat(' + n + ',1fr);--gap:' + (n > 28 ? 2 : 3) + 'px">' + bars + '</div>' +
          '<div class="axis" style="grid-template-columns:repeat(' + n + ',1fr);--gap:' + (n > 28 ? 2 : 3) + 'px">' + axis + '</div></div>' +
          '<p class="note">Busiest day so far: ' + esc(monthName) + ' ' + busiestDay + ', with ' + busiest + ' ' + plural(busiest, 'conversation', 'conversations') + '.</p>';
      }

      function hoursChart(d){
        var h = d.hours, s = d.schedule, i, max = 1, total = 0;
        for (i = 0; i < 24; i++){
          var t = h.open[i] + h.closed[i]; total += t;
          if (t > max) max = t;
        }
        var scope = s.always
          ? 'Open around the clock (' + esc(s.timezone) + ').'
          : 'Business hours: ' + esc(dayRange(s.days)) + ', ' + clock(s.open) + '–' + clock(s.close) + ' (' + esc(s.timezone) + ').';
        if (total === 0){
          return '<p class="sub">' + scope + '</p><div class="empty">No conversations yet this month.</div>';
        }
        var legend = s.always ? '' :
          '<div class="legend"><span><i style="background:var(--grey)"></i>During business hours</span><span><i style="background:var(--brand)"></i>Outside business hours</span></div>';
        var bars = '', axis = '';
        for (i = 0; i < 24; i++){
          var o = h.open[i], c = h.closed[i];
          var tip = esc(hr12(i) + ': ' + (o + c) + ' ' + plural(o + c, 'conversation', 'conversations') + (c ? ' (' + c + ' outside business hours)' : ''));
          var seg = '';
          if (o > 0) seg += '<div class="seg ' + (s.always ? 'brand' : 'grey') + '" style="height:' + barPct(o, max) + '%"></div>';
          if (c > 0) seg += '<div class="seg brand" style="height:' + barPct(c, max) + '%"></div>';
          if (!seg) seg = '<div class="stub"></div>';
          bars += '<div class="col" title="' + tip + '">' + seg + '</div>';
          axis += '<span>' + (i % 6 === 0 ? hr12(i) : '') + '</span>';
        }
        var label = 'Conversations started by hour of day, in ' + s.timezone + '.';
        return '<p class="sub">' + scope + '</p>' + legend +
          '<div class="chart" role="img" aria-label="' + esc(label) + '">' +
          '<div class="bars" style="grid-template-columns:repeat(24,1fr);--gap:3px">' + bars + '</div>' +
          '<div class="axis" style="grid-template-columns:repeat(24,1fr);--gap:3px">' + axis + '</div></div>';
      }

      function historyChart(d){
        var max = 1, i, any = false;
        for (i = 0; i < d.history.length; i++){
          if (d.history[i].conversations > max) max = d.history[i].conversations;
          if (d.history[i].conversations > 0) any = true;
        }
        if (!any) return '<div class="empty">Your monthly history will build up here as the months go by.</div>';
        var cells = '';
        for (i = 0; i < d.history.length; i++){
          var m = d.history[i], isNow = i === d.history.length - 1;
          var h = m.conversations > 0 ? barPct(m.conversations, max) + '%' : '2px';
          var bar = '<div class="item" style="height:' + h + '"><span class="val">' + fmt(m.conversations) + '</span>' +
            (m.conversations > 0 ? '<div class="seg brand' + (isNow ? '' : ' faint') + '"></div>' : '<div class="stub"></div>') + '</div>';
          cells += '<div class="cell" title="' + esc(m.label + ': ' + m.conversations + ' conversations' + (m.questions != null ? ', ' + m.questions + ' questions' : '')) + '">' +
            '<div class="barwrap">' + bar + '</div>' +
            '<div class="mon">' + esc(m.label) + '</div>' +
            '<div class="qs">' + (m.questions != null ? fmt(m.questions) + ' q' : '') + '</div></div>';
        }
        return '<div class="hist" role="img" aria-label="Conversations per month, last six months">' + cells + '</div>' +
          '<p class="note">Bars show conversations. The small figure underneath is questions answered (q).</p>';
      }

      function render(d){
        var brand = safeColor(d.brandColor);
        document.documentElement.style.setProperty('--brand', brand);
        document.title = d.businessName + ' – Chatbot activity';

        var hasQ = d.questions != null;
        var headline = hasQ
          ? (d.questions === 0
              ? 'No questions answered yet in ' + esc(d.monthLabel.split(' ')[0]) + '.'
              : 'Your chatbot answered ' + fmt(d.questions) + ' ' + plural(d.questions, 'question', 'questions') + ' in ' + esc(d.monthLabel.split(' ')[0]) + '.')
          : fmt(d.conversations) + ' ' + plural(d.conversations, 'conversation', 'conversations') + ' so far in ' + esc(d.monthLabel.split(' ')[0]) + '.';
        var headSub = d.conversations === 0
          ? 'Conversations will appear here as soon as a visitor starts chatting.'
          : (hasQ ? 'Across ' + fmt(d.conversations) + ' ' + plural(d.conversations, 'conversation', 'conversations') + ' with visitors to your site.' : '');

        // Three plain facts. Percentages only once there are enough
        // conversations for them to mean something; otherwise "N of M".
        var facts = '<div class="fact"><div class="fig">' + fmt(d.conversations) + '</div>' +
          '<div class="lbl">' + plural(d.conversations, 'conversation', 'conversations') + '</div>' +
          '<div class="det">one chat session, counted when it starts</div></div>';
        var factCount = 1;
        if (d.outside && d.conversations > 0){
          var oc = d.outside.conversations, ot = d.outside.total;
          facts += '<div class="fact"><div class="fig">' + fmt(oc) + '</div>' +
            '<div class="lbl">started outside business hours</div>' +
            '<div class="det">' + (ot >= 10 ? pct(oc, ot) + '% of conversations' : 'of ' + fmt(ot) + ' ' + plural(ot, 'conversation', 'conversations') + ' tracked') + '</div></div>';
          factCount++;
        }
        if (d.conversations > 0){
          var kc = Math.min(d.keptChatting, d.conversations);
          facts += '<div class="fact"><div class="fig">' + fmt(kc) + '</div>' +
            '<div class="lbl">went past the first answer</div>' +
            '<div class="det">' + (d.conversations >= 10 ? pct(kc, d.conversations) + '% of conversations asked a follow-up' : 'of ' + fmt(d.conversations) + ' asked a follow-up') + '</div></div>';
          factCount++;
        }
        var factsHtml = d.conversations > 0 && factCount > 1
          ? '<div class="facts' + (factCount === 2 ? ' two' : '') + '">' + facts + '</div>' : '';

        var html = '<header class="top"><h1>' + esc(d.businessName) + '</h1><span class="month">Chatbot activity · ' + esc(d.monthLabel) + '</span></header>' +
          '<section><p class="headline">' + headline + '</p>' + (headSub ? '<p class="headline-sub">' + headSub + '</p>' : '') + factsHtml + '</section>';

        html += '<section><h2>Conversations per day</h2>' +
          '<p class="sub">How many visitors started a chat each day this month.</p>' + perDayChart(d) +
          (d.detailSince ? '<p class="note">Daily detail starts on ' + esc(niceDate(d.detailSince)) + '. Earlier days this month are included in the totals above only.</p>' : '') +
          '</section>';

        if (d.hours && d.schedule){
          html += '<section><h2>When visitors chat</h2>' + hoursChart(d) + '</section>';
        }

        html += '<section><h2>Last six months</h2>' + historyChart(d) + '</section>';

        var foot = '';
        if (d.cap && hasQ){
          var used = pct(d.questions, d.cap);
          if (used >= 70){
            var barColor = used >= 100 ? 'var(--red)' : (used >= 85 ? 'var(--amber)' : 'var(--brand)');
            foot += '<div class="plan"><p>Your plan includes up to ' + fmt(d.cap) + ' questions a month. You have used ' + fmt(d.questions) + ' (' + used + '%) so far.</p>' +
              '<div class="meter"><b style="width:' + Math.min(100, used) + '%;background:' + barColor + ';"></b></div>' +
              (used >= 100 ? '<p class="warn">You are past this month’s included questions. One busy month is fine; if it keeps up we will get in touch about a plan that fits.</p>' : '') + '</div>';
          } else {
            foot += '<div class="plan"><p>Your plan includes up to ' + fmt(d.cap) + ' questions a month.</p></div>';
          }
        }
        foot += '<p class="defs">A question is each message a visitor sends that your chatbot answers. A conversation is one chat session; it is counted once when it starts, however many questions it contains.</p>';
        html += '<section>' + foot + '</section>';

        app.innerHTML = html;
      }

      fetch(DATA_URL)
        .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, d: j }; }); })
        .then(function(res){
          if (!res.ok){
            app.innerHTML = '<div class="state">' + esc(res.d.error || 'Activity is temporarily unavailable. Try again in a few minutes.') + '</div>';
            return;
          }
          render(res.d);
        })
        .catch(function(){
          app.innerHTML = '<div class="state">Activity is temporarily unavailable. Try again in a few minutes.</div>';
        });
    })();
  </script>
</body>
</html>
